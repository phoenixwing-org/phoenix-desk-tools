[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-desk-tools"
version = "0.1.0"
description = "Phoenix 桌面工具集：FreeCAD 工作空间管理、BOM、Code 工具等。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Phoenix Wing" }]
keywords = ["FreeCAD", "FCStd", "CustomTkinter", "desktop"]

dependencies = [
  "customtkinter>=5.2.0",
  "darkdetect>=0.8.0",
]

[project.optional-dependencies]
dev = []
web = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
]
windows-solidworks = ["pywin32>=307"]

[project.urls]
Repository = "https://gitee.com/PhoenixWing321/phoenix-desk-tools.git"

[project.scripts]
phoenix-desktop = "phoenix.shell.app:run_app"
phoenix-web = "phoenix.web.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["phoenix*"]

[tool.setuptools.package-data]
phoenix = [
    "config/app_config.json",
    "config/workspace.custom.json.example",
    "config/workspace.dotfile.example",
    "config/reorder-members.ignore.example",
]
